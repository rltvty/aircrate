[package]
name = "aircrate"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
rodio = { git = "https://github.com/RustAudio/rodio.git", rev = "f91f1c32b9cbdefbc2723c7bcd12c5e5bd478aa3", features = ["flac", "mp3", "wav", "symphonia-aac"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
futures-util = "0.3"
bytes = "1.0"
bevy-tokio-tasks = "0.16"
id3 = "1.13"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], default-features = false }
uuid = { version = "1.0", features = ["v4"] }
md5 = "0.7"
