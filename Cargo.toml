[package]
name = "aircrate"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16.1"
bevy_cobweb = "0.17.2"
bevy_cobweb_ui = { version = "0.20.1", features = ["hot_reload"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
symphonia = { version = "0.5", features = ["aac", "mp3"] }
rodio = { version = "0.20.1", features = ["symphonia"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
futures-util = "0.3"
bytes = "1.0"
bevy-tokio-tasks = "0.16"
id3 = "1.13"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], default-features = false }
uuid = { version = "1.0", features = ["v4"] }
md5 = "0.7"
